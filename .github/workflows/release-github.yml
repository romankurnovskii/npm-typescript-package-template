name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Approve esbuild build scripts
        run: pnpm approve-builds esbuild

      - name: Install Dependencies
        run: pnpm install

      - name: Test
        run: pnpm run test

      - name: Create Release Changesets
        id: changesets
        uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
